name: Echo Hello

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    branches: [ main ]  # Optional: Trigger on push to main branch

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Echo Hello
        run: echo "hello"

  job2:
    needs: job1  # This job depends on job1
    runs-on: ubuntu-latest
    steps:
      - name: Echo World
        run: echo "world"
